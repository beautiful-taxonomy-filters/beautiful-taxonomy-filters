name: Claude

# Runs Claude on demand: mention "@claude" in an issue comment or in a review
# comment on a pull request and it replies on the same thread. It can also make
# changes — on an open pull request it pushes straight to that branch.
#
# This is also how outside contributions get reviewed. issue_comment events run
# in the context of this repository rather than the contributor's fork, so the
# CLAUDE_CODE_OAUTH_TOKEN secret is available here even when the pull request
# comes from a fork and claude-code-review.yml had to skip it. Comment
# "@claude review this pull request" on it.
#
# Only users with write access to this repository can trigger a run; the action
# rejects everyone else, and bot accounts, before Claude starts.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude:
    name: Respond to @claude
    # Cheap pre-filter so runners do not start on unrelated comments; the
    # action checks the trigger phrase itself as well.
    if: contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      # Lets Claude read the results of the other workflows on a pull request.
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          # Check out the SHA rather than letting the action resolve the
          # default branch by name, so the workspace is left on a detached
          # HEAD with no local "master" branch.
          #
          # For a pull request from a fork the action runs
          #   git fetch origin pull/N/head:<the fork's head ref name>
          # and contributors commonly work on their fork's own "master", which
          # collides with the branch checkout would otherwise have left us on:
          #   fatal: refusing to fetch into branch 'refs/heads/master'
          #          checked out at '/home/runner/work/...'
          ref: ${{ github.sha }}

      - name: Claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
